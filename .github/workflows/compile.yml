name: Automated-Build

on:
  workflow_dispatch:
    inputs:
      make_args:
        description: pass extra make argumments to control features not explicitly handled by CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant_name: "R3Z"
            psx_profile: "psx"
            pad_profile: "no-ds34"
            storage_profile: "all"
            netfs: "0"
          - variant_name: "R3Z-NETFS"
            psx_profile: "psx"
            pad_profile: "no-ds34"
            storage_profile: "all"
            netfs: "1"
    runs-on: ubuntu-latest
    # Track the current PS2 homebrew toolchain so CI catches PS2SDK compatibility changes.
    container: ghcr.io/ps2homebrew/ps2homebrew:main
    steps:

    - name: Install dependencies
      run: |
        if command -v apk >/dev/null 2>&1; then
          apk add --no-cache make git zip gcc musl-dev gmp mpfr4 mpc1
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y make git zip gcc libc6-dev libgmp10 libmpfr6 libmpc3
        else
          echo "No supported package manager found for dependency install." >&2
          exit 1
        fi

    - name: Verify toolchain runtime libs
      run: |
        cc1_path="$(mips64r5900el-ps2-elf-gcc -print-prog-name=cc1)"
        if [ -x "$cc1_path" ]; then
          ldd "$cc1_path"
        fi
        mips64r5900el-ps2-elf-gcc --version

    - uses: actions/checkout@v6
    - run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git fetch --prune --unshallow
    - name: Prepare PS2SDK source for local module builds
      run: |
        if [ -n "${PS2SDKSRC:-}" ] && [ -f "$PS2SDKSRC/Defs.make" ] && [ -f "$PS2SDKSRC/iop/Rules.make" ]; then
          echo "Using PS2SDKSRC=$PS2SDKSRC"
          exit 0
        fi
        if [ -n "${PS2SDK:-}" ] && [ -f "$PS2SDK/Defs.make" ] && [ -f "$PS2SDK/iop/Rules.make" ]; then
          echo "Using PS2SDK source tree at $PS2SDK"
          echo "PS2SDKSRC=$PS2SDK" >> "$GITHUB_ENV"
          exit 0
        fi
        ps2sdk_src_dir="${RUNNER_TEMP:-/tmp}/ps2sdk-src"
        git clone --depth 1 https://github.com/ps2dev/ps2sdk.git "$ps2sdk_src_dir"
        echo "PS2SDKSRC=$ps2sdk_src_dir" >> "$GITHUB_ENV"
    - name: Normalize line endings (strip CR)
      run: |
        # CI runs in Alpine/BusyBox. A stray CR (Windows CRLF) breaks shell scripts:
        # a "#!/bin/sh\r" shebang makes `env` look for "sh\r", and a trailing \r on
        # any line is parsed as part of the command (e.g. `set -\r`, `case ... in\r`).
        # Git's .gitattributes eol=lf is the primary guard, but a hand-uploaded CRLF
        # file can defeat it, so we also strip CR here at build time. `tr` reads from
        # stdin (it never takes a filename argument), so we loop per file via a temp
        # file. \r is the POSIX-named carriage-return escape recognized by BusyBox tr.
        find . -type f \( \
          -name '*.sh' -o -name 'Makefile' -o -name '*.c' -o -name '*.h' -o \
          -name '*.mk' -o -name '*.yml' -o -name '*.yaml' -o -name '*.LNG' -o \
          -name '*.s' -o -name '*.S' -o -name '*.asm' -o -name '*.inc' -o \
          -name '*.ld' -o -name '*.txt' -o -name '*.md' -o -name '*.cfg' -o \
          -name '*.cnf' -o -name '*.conf' -o -name '*.ini' -o -name '*.ee' -o \
          -name '*.iop' -o -name '*.cmake' -o -name '.clang-format' -o \
          -name '.clang-tidy' -o -name '.gitignore' \
        \        ) -exec sh -c 'for f in "$@"; do tr -d "\r" < "$f" > "$f.tmp" && mv "$f.tmp" "$f"; done' _ {} +

    - name: Patch FatFs for Chinese (GBK/CP936) long file names
      run: |
        # 让 FAT32/exFAT 设备上的中文/日文长文件名正确显示：改写 PS2SDK 自带
        # FatFs 的 ffconf.h（FF_CODE_PAGE=936 + LFN），并从源码重编
        # bdm / bdmfs_fatfs / usbmass_bd 三个 IOP IRX，再拷回 $PS2SDK/iop/irx，
        # 这样 wLaunchELF 嵌入的是补丁后的 IRX。必须在 Compile 之前执行。
        # （脚本内部对 PS2SDKSRC / FatFs 源码缺失都有兜底，不强制前置条件。）
        bash scripts/ci/patch_fatfs_chinese.sh

    - name: Install libnfs (PS2 EE) — required by the NETFS build
      if: matrix.netfs == '1'
      run: |
        echo "PS2SDK=$PS2SDK"
        git clone --depth 1 https://github.com/sahlberg/libnfs.git "${RUNNER_TEMP:-/tmp}/libnfs"
        cd "${RUNNER_TEMP:-/tmp}/libnfs/ps2_ee"
        # ps2_compat.c calls inet_addr()/htons() but is missing <arpa/inet.h>;
        # modern PS2 GCC treats implicit declarations as hard errors, so the
        # ps2_ee build of libnfs fails. Inject the include. The inet_addr/htons
        # symbols/macros come from PS2SDK's <arpa/inet.h> + the linked -lps2ip.
        awk ' /#include "ps2_compat.h"/ { print; print "#include <arpa/inet.h>"; next } { print } ' ps2_compat.c > ps2_compat.c.tmp && mv ps2_compat.c.tmp ps2_compat.c
        grep -n "arpa/inet.h" ps2_compat.c || echo "WARN: arpa/inet.h not injected"
        # libnfs' PS2 port ships its DNS/hostname shims in ps2_ee/ps2_compat.c,
        # but the stock Makefile.PS2_EE forgets to compile/link ps2_compat.o, so
        # nfs_getaddrinfo / nfs_freeaddrinfo are left undefined. Patch them in.
        awk ' /\.\.\/nfs\/nfsacl\.o/ { print; print "EE_OBJS += ../ps2_ee/ps2_compat.o"; next } { print } ' Makefile.PS2_EE > Makefile.PS2_EE.tmp && mv Makefile.PS2_EE.tmp Makefile.PS2_EE
        grep -n "ps2_compat.o" Makefile.PS2_EE || echo "WARN: ps2_compat.o not patched"
        make -f Makefile.PS2_EE install
        # Also expose libnfs via the ports/ paths that wLaunchELF adds to its
        # own build flags, so #include <nfsc/libnfs.h> and -lnfs always resolve.
        mkdir -p "$PS2SDK/ports/include/nfsc" "$PS2SDK/ports/lib"
        cp -fr "$PS2SDK/ee/include/nfsc" "$PS2SDK/ports/include/"
        cp -f "$PS2SDK/ee/lib/libnfs.a" "$PS2SDK/ports/lib/"
        echo "libnfs install check:"
        ls -l "$PS2SDK/ports/include/nfsc/libnfs.h" "$PS2SDK/ports/lib/libnfs.a"

    - name: Ensure scripts are executable
      run: |
        chmod +x scripts/ci/resolve_make_args.sh scripts/ci/patch_fatfs_chinese.sh

    - name: Compile wLaunchELF
      run: |
        FLAGS="$(bash scripts/ci/resolve_make_args.sh \
          "${{ matrix.psx_profile }}" \
          "${{ matrix.pad_profile }}" \
          "${{ matrix.storage_profile }}" \
          0 0 \
          "${{ matrix.netfs }}")"
        echo "Resolved make flags: $FLAGS"
        make rebuild ${{ github.event.inputs.make_args }} $FLAGS

    - name: Verify loader low-memory layout guard
      run: |
        make -C loader check-layout DEBUG=0

    - name: Rename output ELF for variant
      run: |
        set -- BOOT*.ELF
        if [ "$1" = 'BOOT*.ELF' ]; then
          echo "No BOOT*.ELF produced by build." >&2
          exit 1
        fi
        cp "$1" "WLE-${{ matrix.variant_name }}.ELF"

    - name: Upload variants artifact ELF
      uses: actions/upload-artifact@v7
      with:
        name: "WLE-${{ matrix.variant_name }}"
        path: |
            WLE-${{ matrix.variant_name }}.ELF

####################################################### 
  release:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
    steps:

    - uses: actions/checkout@v6
    - run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git fetch --prune --unshallow

    - name: Download all artifacts
      uses: actions/download-artifact@v7
      with:
        path: WLE/
        pattern: "WLE-R3Z*"

    - name: list
      run: |
        ls -R

    - name: Publish latest automated build release
      if: github.ref == 'refs/heads/master'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        tag="latest"
        title="Latest automated build"

        if gh release view "$tag" >/dev/null 2>&1; then
          gh release edit "$tag" --title "$title"
        else
          gh release create "$tag" --title "$title" --notes "Automated build for ${GITHUB_SHA}" --target "${GITHUB_SHA}"
        fi

        mapfile -d '' assets < <(find WLE -type f -name '*.ELF' -print0)
        if [ "${#assets[@]}" -eq 0 ]; then
          echo "No ELF assets found under WLE/." >&2
          exit 1
        fi
        gh release upload "$tag" "${assets[@]}" --clobber

    - name: Publish language files release
      if: github.ref == 'refs/heads/master'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        tag="language-files"
        title="Translations"

        if gh release view "$tag" >/dev/null 2>&1; then
          gh release edit "$tag" --title "$title"
        else
          gh release create "$tag" --title "$title" --notes "Automated language files for ${GITHUB_SHA}" --target "${GITHUB_SHA}"
        fi

        mapfile -d '' assets < <(find Lang -type f -name '*.LNG' -print0)
        if [ "${#assets[@]}" -eq 0 ]; then
          echo "No language assets found under Lang/." >&2
          exit 1
        fi
        gh release upload "$tag" "${assets[@]}" --clobber

  trigger-auto-update:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [release]
    strategy:
      matrix:
        include:
          - repo: israpps/FreeMcBoot-Installer
            enabled: false
          - repo: israpps/Funtuna-Fork
            enabled: false
          - repo: israpps/PlayStation2-Basic-BootLoader
            enabled: false
    steps:
    - name: trigger israpps auto-update system
      if: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && matrix.enabled }}
      uses: peter-evans/repository-dispatch@v1
      with:
          token: ${{ secrets.IUS }}
          repository: ${{ matrix.repo }} 
          event-type: Component_update
          client-payload: '{"sha": "${{ github.sha }}"}'
    - name: auto-update disabled for target
      if: ${{ !matrix.enabled }}
      run: echo "Auto-update dispatch disabled for ${{ matrix.repo }}."
